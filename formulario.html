<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de registro</title>
</head>
<body>

    <header>
        <h1>Formulario de registro</h1>
        <hr>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="formulario.html">Formulario</a></li>
                <li><a href="tabla.html">Tabla de datos</a></li>
                <li><a href="galeria.html">Galería</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
        <hr>
    </header>

    <main>
        <h2>Introduce tus datos</h2>

        <form action="tabla.html" method="get">

            <fieldset>
                <legend>Datos personales</legend>

                <p>
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre"
                           placeholder="Tu nombre" required>
                </p>

                <p>
                    <label for="apellidos">Apellidos:</label>
                    <input type="text" id="apellidos" name="apellidos"
                           placeholder="Tus apellidos" required>
                </p>

                <p>
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password"
                           minlength="6" required>
                </p>

                <p>
                    <label for="telefono">Teléfono:</label>
                    <input type="tel" id="telefono" name="telefono"
                           pattern="[0-9]{9}" placeholder="600000000" required>
                </p>

                <p>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email"
                           placeholder="correo@ejemplo.com" required>
                </p>

                <p>Sexo:</p>
                <p>
                    <input type="radio" id="hombre" name="sexo" value="hombre" checked>
                    <label for="hombre">Hombre</label>

                    <input type="radio" id="mujer" name="sexo" value="mujer">
                    <label for="mujer">Mujer</label>

                    <input type="radio" id="otro" name="sexo" value="otro">
                    <label for="otro">Otro</label>
                </p>

            </fieldset>

            <br>
            <input type="submit" value="Enviar">
            <input type="reset" value="Borrar">

        </form>
    </main>

    <footer>
        <hr>
        <p><small>&copy; 2025 - Alejandro Brugarolas Sánchez-Lidón</small></p>
    </footer>

</body>
</html>
