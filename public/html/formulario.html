<body>

    <header>
        <h1>Formulario de registro</h1>

        <nav>
            <ul>
                <li><a href="../../public/index.html">Inicio</a></li>
                <li><a href="../../public/html/formulario.html">Formulario</a></li>

            </ul>
        </nav>
        <hr>
    </header>

    <main>
        <h2>Introduce tus datos</h2>

        <form action="../../ws/controllers/crearUsuario2.php" method="POST">

            <fieldset>
                <legend>Datos personales</legend>

                <p>
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
                </p>

                <p>
                    <label for="apellidos">Apellidos:</label>
                    <input type="text" id="apellidos" name="apellidos" placeholder="Tus apellidos">
                </p>

                <p>
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" minlength="6">
                </p>

                <p>
                    <label for="telefono">Teléfono:</label>
                    <input type="tel" id="telefono" name="telefono" pattern="[0-9]{9}" placeholder="600000000">
                </p>

                <p>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="correo@ejemplo.com">
                </p>

                <p>Sexo:</p>
                <p>
                    <input type="radio" id="hombre" name="sexo" value="H" checked>
                    <label for="hombre">Hombre</label>

                    <input type="radio" id="mujer" name="sexo" value="M">
                    <label for="mujer">Mujer</label>

                    <input type="radio" id="otro" name="sexo" value="O">
                    <label for="otro">Otro</label>
                </p>

            </fieldset>

            <br>
            <input type="submit" value="Enviar">
            <input type="reset" value="Borrar">

        </form>
    </main>

    <footer>
        <hr>
        <p><small>2026 - Jose Manuel Gambin Manresa</small></p>
    </footer>

</body>

</html>
